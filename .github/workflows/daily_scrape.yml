name: Daily Guangdong Gravure Jobs Scraper

on:
  schedule:
    # 每天北京时间 07:30 和 17:30 自动运行 (UTC 23:30 和 09:30)
    - cron: '30 23 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run parser unit tests
        run: python -m unittest scraper/test_parser.py -v

      - name: Run daily Guangdong gravure scraper
        run: python scraper/scraper.py --output data/jobs.json --max-pages 3

      - name: Commit updated jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --staged --quiet || git commit -m "chore: update Guangdong gravure jobs $(date +'%Y-%m-%d')"
          git push
